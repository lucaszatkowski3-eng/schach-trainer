<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mein Schachtrainer</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main>
        <h1>Mein Schachtrainer</h1>

        <section class="character-area">

            <div class="points">
                ⭐ <span id="points">0</span> Punkte
            </div>

            <div class="character">
                🧸
            </div>

            <div class="speech">
                Hallo! 👋
            </div>

            <h2>Chessy</h2>

            <button id="feedButton">
                🍎 Füttern
            </button>

            <button id="chessButton">
                ♟️ Schach spielen
            </button>

            <button id="shopButton">
                🛍️ Shop
            </button>

        </section>
    </main>

    <script src="js/main.js"></script>

</body>
</html>
